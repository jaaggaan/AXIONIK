name: freesalewifi
description: FreeSaleWiFi in-store push notification and WiFi consent app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  geofence_foreground_service: ^1.0.0
  layrz_wifi: ^1.0.0
  permission_handler: ^11.3.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_riverpod: ^2.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
